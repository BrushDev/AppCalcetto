<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e7a3d">
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Sorteggio Calcetto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra impostazioni in alto; sotto campo verticale a sinistra + rosa a destra (una colonna su telefono) */
:root {
  --bg: #eaf0ea;
  --surface: #ffffff;
  --surface-2: #f3f6f2;
  --ink: #13211a;
  --muted: #5a6a5f;
  --line: #d3ddd4;
  --turf: #2e7a3d;
  --turf-2: #297035;
  --chalk: rgba(255,255,255,.85);
  --team-a: #ffffff;
  --team-a-ink: #16306e;
  --team-b: #2553d9;
  --team-b-ink: #ffffff;
  --pick: #ffd400;
  --warn: #b4540a;
  --warn-bg: #fff1e2;
  --btn: #13211a;
  --btn-ink: #f1f6f1;
  --r-por: #d9a400;
  --r-dif: #2c6fd1;
  --r-cen: #2f9a55;
  --r-att: #d2402f;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1511; --surface: #16211a; --surface-2: #1c2921; --ink: #e5eee6; --muted: #92a496;
    --line: #2a3a2f; --btn: #e5eee6; --btn-ink: #0e1511; --warn: #ffb36b; --warn-bg: #3a2512;
    --turf: #276b34; --turf-2: #22612e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1511; --surface: #16211a; --surface-2: #1c2921; --ink: #e5eee6; --muted: #92a496;
  --line: #2a3a2f; --btn: #e5eee6; --btn-ink: #0e1511; --warn: #ffb36b; --warn-bg: #3a2512;
  --turf: #276b34; --turf-2: #22612e; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 40px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.wrap > * { min-width: 0; }
h1, h2 { font-family: var(--display); font-weight: 800; text-transform: uppercase; letter-spacing: .02em; margin: 0; line-height: 1; text-wrap: balance; }
h1 { font-size: 34px; }
h2 { font-size: 22px; }
.label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--pick); outline-offset: 2px; }

header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; }
header.top p { margin: 0; color: var(--muted); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; min-width: 0; }

/* impostazioni */
.panel.settings { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px 24px; align-items: start; }
.field { display: grid; gap: 8px; min-width: 0; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { font-family: var(--display); font-weight: 700; font-size: 20px; min-width: 44px; height: 42px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); font-variant-numeric: tabular-nums; }
.seg button[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.need { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.need b { color: var(--ink); font-variant-numeric: tabular-nums; }

/* layout principale */
.main { display: grid; grid-template-columns: minmax(0, 500px) minmax(0, 1fr); gap: 16px; align-items: start; }

/* campo */
.pitch-col { display: grid; gap: 12px; min-width: 0; }
.teamhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tag { display: inline-flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 700; font-size: 18px; text-transform: uppercase; letter-spacing: .03em; }
.tag i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
.tag.a i { background: var(--team-a); box-shadow: inset 0 0 0 1px #9aa6bd; }
.tag.b i { background: var(--team-b); }
.pitch { position: relative; width: 100%; aspect-ratio: 68 / 105; max-width: 100%; border-radius: 12px; overflow: hidden; background: var(--turf); box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); user-select: none; -webkit-user-select: none; }
.pitch svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.tok { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 3px; width: 19%; max-width: 92px; padding: 2px 0; background: none; border: 0; touch-action: manipulation; }
.shirt { width: clamp(30px, 9vw, 42px); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: clamp(11px, 2.8vw, 14px); letter-spacing: .03em; box-shadow: 0 2px 6px rgba(0,0,0,.35); border: 2px solid rgba(255,255,255,.9); transition: transform .15s ease, box-shadow .15s ease; }
.tok.a .shirt { background: var(--team-a); color: var(--team-a-ink); border-color: #c9d3e6; }
.tok.b .shirt { background: var(--team-b); color: var(--team-b-ink); }
.tok.empty .shirt { background: rgba(0,0,0,.18); color: rgba(255,255,255,.85); border: 2px dashed rgba(255,255,255,.7); box-shadow: none; }
.tok .nm { max-width: 100%; font-size: clamp(10px, 2.7vw, 12.5px); font-weight: 700; color: #fff; background: rgba(8,20,12,.72); padding: 1px 6px; border-radius: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.35; }
.tok .oor { position: absolute; top: 0; right: 14%; width: 15px; height: 15px; border-radius: 50%; background: var(--pick); color: #231d00; font-size: 11px; font-weight: 800; display: grid; place-items: center; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
.tok.sel .shirt { transform: scale(1.15); box-shadow: 0 0 0 4px var(--pick), 0 4px 10px rgba(0,0,0,.4); }
.tok.target:not(.sel) .shirt { animation: pulse 1.1s ease-in-out infinite; }
.tok.pop .shirt { animation: pop .35s ease; }
@keyframes pulse { 50% { box-shadow: 0 0 0 3px rgba(255,212,0,.55), 0 2px 6px rgba(0,0,0,.35); } }
@keyframes pop { 40% { transform: scale(1.25); } }

.hint { font-size: 13px; color: var(--muted); min-height: 1.45em; margin: 0; }
.hint.on { color: var(--ink); font-weight: 600; }

.bench { display: flex; flex-wrap: wrap; gap: 6px; min-height: 36px; align-items: center; }
.bench .chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 5px 12px; font-weight: 600; font-size: 14px; }
.bench .chip.sel { box-shadow: 0 0 0 3px var(--pick); border-color: transparent; }
.bench .none { color: var(--muted); font-size: 13px; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; font-weight: 600; font-size: 14px; }
.btn.primary { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); font-family: var(--display); font-size: 20px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; padding: 10px 20px; }
.btn.small { padding: 6px 10px; font-size: 13px; }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* rosa */
.roster-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.count { font-family: var(--display); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.count.low { color: var(--warn); }
.avail { display: flex; flex-wrap: wrap; gap: 6px; }
.avail span { font-size: 12.5px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.avail span.low { background: var(--warn-bg); color: var(--warn); border-color: transparent; }

.addform { display: grid; gap: 8px; padding: 12px; border-radius: 10px; background: var(--surface-2); }
.addrow { display: flex; gap: 8px; }
.addrow input { flex: 1; min-width: 0; font: inherit; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.roles { display: flex; flex-wrap: wrap; gap: 5px; }
.rchip { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 3px 8px 3px 6px; font-size: 12.5px; font-weight: 700; letter-spacing: .03em; display: inline-flex; align-items: center; gap: 5px; color: var(--muted); }
.rchip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.rchip[aria-pressed="true"] { color: var(--ink); border-color: currentColor; }
.rchip[aria-pressed="true"][data-r="POR"]::before { background: var(--r-por); }
.rchip[aria-pressed="true"][data-r="DIF"]::before { background: var(--r-dif); }
.rchip[aria-pressed="true"][data-r="CEN"]::before { background: var(--r-cen); }
.rchip[aria-pressed="true"][data-r="ATT"]::before { background: var(--r-att); }

.list { list-style: none; margin: 0; padding: 0; display: grid; }
.list li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; }
.list li.out .pname { color: var(--muted); text-decoration: line-through; }
.list li.out .roles { opacity: .5; }
.list .pname { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .body { display: grid; gap: 5px; min-width: 0; }
.list input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--turf); }
.list li.empty-list { display: block; color: var(--muted); font-size: 14px; padding: 12px 0; }
.del { border: 0; background: none; color: var(--muted); font-size: 20px; line-height: 1; padding: 4px 8px; border-radius: 6px; }
.del:hover { color: var(--r-att); background: var(--surface-2); }
.note { font-size: 13px; padding: 8px 12px; border-radius: 8px; background: var(--warn-bg); color: var(--warn); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--btn); color: var(--btn-ink); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; z-index: 10; }

@media (max-width: 820px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .pitch-col { max-width: 520px; width: 100%; margin: 0 auto; }
}
@media (max-width: 560px) {
  .panel.settings { grid-template-columns: minmax(0, 1fr); }
  h1 { font-size: 28px; }
}
@media (prefers-reduced-motion: reduce) {
  .shirt { transition: none; }
  .tok.target .shirt, .tok.pop .shirt { animation: none; }
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>Sorteggio Calcetto</h1>
    <p>Scegli il formato, segna chi gioca, sorteggia.</p>
  </header>

  <section class="panel settings" aria-label="Impostazioni partita">
    <div class="field">
      <span class="label">Giocatori per squadra</span>
      <div class="seg" id="nSeg"></div>
    </div>
    <div class="field">
      <span class="label">Modulo <span style="text-transform:none;letter-spacing:0;font-weight:500">(portiere escluso)</span></span>
      <div class="seg" id="fSeg"></div>
      <div class="need" id="need"></div>
    </div>
  </section>

  <div class="main">
    <section class="pitch-col" aria-label="Campo">
      <div class="teamhead">
        <span class="tag b"><i></i>Blu</span>
      </div>
      <div class="pitch" id="pitch">
        <svg viewBox="0 0 68 105" preserveAspectRatio="none" aria-hidden="true">
          <g id="stripes"></g>
          <g fill="none" stroke="rgba(255,255,255,.85)" stroke-width=".4">
            <rect x="2" y="2" width="64" height="101"/>
            <line x1="2" y1="52.5" x2="66" y2="52.5"/>
            <circle cx="34" cy="52.5" r="9.15"/>
            <rect x="13.84" y="2" width="40.32" height="16.5"/>
            <rect x="24.84" y="2" width="18.32" height="5.5"/>
            <path d="M26.7 18.5 A9.15 9.15 0 0 0 41.3 18.5"/>
            <rect x="13.84" y="86.5" width="40.32" height="16.5"/>
            <rect x="24.84" y="97.5" width="18.32" height="5.5"/>
            <path d="M26.7 86.5 A9.15 9.15 0 0 1 41.3 86.5"/>
            <rect x="30.34" y=".4" width="7.32" height="1.6"/>
            <rect x="30.34" y="103" width="7.32" height="1.6"/>
          </g>
          <g fill="rgba(255,255,255,.85)">
            <circle cx="34" cy="52.5" r=".6"/><circle cx="34" cy="13" r=".5"/><circle cx="34" cy="92" r=".5"/>
          </g>
        </svg>
        <div id="tokens"></div>
      </div>
      <div class="teamhead">
        <span class="tag a"><i></i>Bianchi</span>
        <button class="btn small ghost" id="copyBtn">Copia formazioni</button>
      </div>
      <p class="hint" id="hint"></p>
      <div class="field">
        <span class="label">Panchina</span>
        <div class="bench" id="bench"></div>
      </div>
    </section>

    <section class="panel" aria-label="Rosa">
      <div class="roster-head">
        <h2>Rosa</h2>
        <span class="count" id="count"></span>
      </div>
      <div class="avail" id="avail"></div>
      <button class="btn primary" id="genBtn">Genera squadre</button>
      <form class="addform" id="addForm" autocomplete="off">
        <span class="label">Nuovo giocatore</span>
        <div class="addrow">
          <input id="nameIn" type="text" placeholder="Nome" maxlength="24" aria-label="Nome giocatore">
          <button class="btn" type="submit">Aggiungi</button>
        </div>
        <div class="roles" id="newRoles"></div>
      </form>
      <ul class="list" id="list"></ul>
    </section>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const ROLES = ['POR', 'DIF', 'CEN', 'ATT'];
const ROLE_NAME = { POR: 'Portiere', DIF: 'Difensore', CEN: 'Centrocampista', ATT: 'Attaccante' };
const FORMATIONS = {
  5: ['2-2', '1-2-1', '3-1', '2-1-1', '1-1-2'],
  6: ['2-2-1', '3-1-1', '2-1-2', '1-2-2', '3-2', '2-3'],
  7: ['3-2-1', '2-3-1', '3-1-2', '2-2-2', '3-3', '2-1-2-1'],
  8: ['3-3-1', '3-2-2', '2-3-2', '4-2-1', '3-1-3', '2-4-1'],
  9: ['3-3-2', '4-3-1', '3-4-1', '3-2-3', '4-2-2', '2-3-3'],
  10: ['4-3-2', '3-4-2', '4-4-1', '3-3-3', '4-2-3', '3-5-1'],
  11: ['4-4-2', '4-3-3', '3-5-2', '4-2-3-1', '3-4-3', '5-3-2', '4-5-1', '4-3-1-2']
};
const LS = 'calcetto-v1';
const $ = id => document.getElementById(id);

let S = null;
let sel = null;          // {t:'A'|'B'|'bench', i}
let popKeys = new Set(); // token appena scambiati
let newRoles = new Set(['CEN']);

function uid() { return Math.random().toString(36).slice(2, 9); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function load() { try { const s = JSON.parse(localStorage.getItem(LS)); return s && s.players ? s : null; } catch (e) { return null; } }
function save() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} }
const DEFAULT_PLAYERS = [
  ['Bruno', 'CEN ATT'], ['Danilo', 'DIF CEN ATT'], ['Rino', 'POR'], ['Carlo', 'POR'], ['Luca', 'ATT'],
  ['Gigginho', 'ATT'], ['Enzo', 'CEN'], ['Roby', 'DIF'], ['Maestro', 'DIF CEN'], ['Carmine', 'DIF CEN'],
  ['Raffo', 'DIF CEN'], ['Benny', 'DIF CEN'], ['Leo', 'ATT'], ['Piero', 'CEN'], ['Salvatore', 'DIF'],
  ['Emi', 'CEN'], ['Gianni', 'DIF'], ['AndreaG', 'DIF CEN']
];
function seed() {
  return { n: 5, form: '2-2', players: DEFAULT_PLAYERS.map(([name, r]) => ({ id: uid(), name, roles: r.split(' '), on: true })), A: [], B: [], bench: [] };
}
const byId = id => S.players.find(p => p.id === id);

function layout() {
  const lines = S.form.split('-').map(Number), L = lines.length;
  const slots = [{ r: 'POR', x: 50, y: 92.5 }];
  lines.forEach((k, li) => {
    const y = L === 1 ? 70 : 81 - li * (24 / (L - 1));
    const r = li === 0 ? 'DIF' : li === L - 1 ? 'ATT' : 'CEN';
    const spread = k === 1 ? 0 : Math.min(78, 19.5 * (k - 1));
    for (let j = 0; j < k; j++) slots.push({ r, x: k === 1 ? 50 : 50 - spread / 2 + j * spread / (k - 1), y });
  });
  return slots;
}
function needs() { const c = { POR: 0, DIF: 0, CEN: 0, ATT: 0 }; layout().forEach(s => c[s.r]++); return c; }
function resetTeams() { S.A = Array(S.n).fill(null); S.B = Array(S.n).fill(null); S.bench = []; }

function generate() {
  const slots = layout();
  const pool = new Set(shuffle(S.players.filter(p => p.on).map(p => p.id)));
  const A = Array(S.n).fill(null), B = Array(S.n).fill(null);
  const need = needs();
  const eligible = r => [...pool].filter(id => byId(id).roles.includes(r)).length;
  // ruoli più scarsi per primi, così i giocatori rari finiscono dove servono
  const order = ROLES.filter(r => need[r]).sort((a, b) => eligible(a) / need[a] - eligible(b) / need[b]);
  const first = Math.random() < .5 ? 'A' : 'B';
  for (const r of order) {
    const idx = slots.map((s, i) => s.r === r ? i : -1).filter(i => i >= 0);
    const turns = [];
    idx.forEach(i => { turns.push([first, i]); turns.push([first === 'A' ? 'B' : 'A', i]); });
    for (const [t, i] of turns) {
      const cands = [...pool].filter(id => byId(id).roles.includes(r));
      if (!cands.length) break;
      const min = Math.min(...cands.map(id => byId(id).roles.length));
      const best = cands.filter(id => byId(id).roles.length === min);
      const pick = best[Math.floor(Math.random() * best.length)];
      (t === 'A' ? A : B)[i] = pick; pool.delete(pick);
    }
  }
  // posti rimasti vuoti: giocatori fuori ruolo, alternando le squadre
  const rest = shuffle([...pool]);
  for (let i = 0; i < S.n; i++) for (const T of (first === 'A' ? [A, B] : [B, A])) if (T[i] == null && rest.length) T[i] = rest.pop();
  S.A = A; S.B = B; S.bench = rest;
  sel = null; popKeys = new Set(); save();
}

function get(a) { return S[a.t][a.i] ?? null; }
function put(a, v) { S[a.t][a.i] = v; }
function swap(a, b) {
  const va = get(a), vb = get(b);
  put(a, vb); put(b, va);
  S.bench = S.bench.filter(x => x != null);
  popKeys = new Set([a.t + a.i, b.t + b.i]);
  save();
}
function tap(a) {
  if (!sel) { if (get(a) != null) sel = a; }
  else if (sel.t === a.t && sel.i === a.i) sel = null;
  else { swap(sel, a); sel = null; }
  render();
}

function tokenEl(team, i, slot) {
  const id = S[team][i], p = id ? byId(id) : null;
  const x = team === 'A' ? slot.x : 100 - slot.x, y = team === 'A' ? slot.y : 100 - slot.y;
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'tok ' + team.toLowerCase() + (p ? '' : ' empty');
  if (sel && sel.t === team && sel.i === i) b.classList.add('sel');
  else if (sel) b.classList.add('target');
  if (popKeys.has(team + i)) b.classList.add('pop');
  b.style.left = x + '%'; b.style.top = y + '%';
  const off = p && !p.roles.includes(slot.r);
  b.innerHTML = `<span class="shirt">${slot.r}</span>${p ? `<span class="nm"></span>` : ''}${off ? '<span class="oor" title="Fuori ruolo">!</span>' : ''}`;
  if (p) b.querySelector('.nm').textContent = p.name;
  b.title = p ? `${p.name} · ${ROLE_NAME[slot.r]}${off ? ' (fuori ruolo, ruoli: ' + p.roles.join(', ') + ')' : ''}` : `Posto libero · ${ROLE_NAME[slot.r]}`;
  b.setAttribute('aria-label', b.title);
  wire(b, { t: team, i });
  return b;
}
function wire(el, a) {
  el.addEventListener('click', () => tap(a));
  el.draggable = get(a) != null;
  el.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', JSON.stringify(a)); sel = null; });
  el.addEventListener('dragover', e => e.preventDefault());
  el.addEventListener('drop', e => {
    e.preventDefault();
    try { const from = JSON.parse(e.dataTransfer.getData('text/plain')); if (from.t !== a.t || from.i !== a.i) { swap(from, a); render(); } } catch (err) {}
  });
}

function render() {
  const slots = layout(), need = needs();
  // numero giocatori
  $('nSeg').innerHTML = '';
  for (let n = 5; n <= 11; n++) {
    const b = document.createElement('button');
    b.textContent = n; b.setAttribute('aria-pressed', n === S.n);
    b.setAttribute('aria-label', `${n} contro ${n}`);
    b.onclick = () => { if (S.n === n) return; S.n = n; S.form = FORMATIONS[n][0]; resetTeams(); sel = null; save(); render(); };
    $('nSeg').append(b);
  }
  // moduli
  $('fSeg').innerHTML = '';
  FORMATIONS[S.n].forEach(f => {
    const b = document.createElement('button');
    b.textContent = f; b.setAttribute('aria-pressed', f === S.form);
    b.onclick = () => { S.form = f; sel = null; save(); render(); };
    $('fSeg').append(b);
  });
  $('need').innerHTML = 'Per squadra: ' + ROLES.filter(r => need[r]).map(r => `<span><b>${need[r]}</b> ${ROLE_NAME[r].toLowerCase()}</span>`).join('');

  // campo
  const tk = $('tokens'); tk.innerHTML = '';
  slots.forEach((s, i) => { tk.append(tokenEl('B', i, s)); tk.append(tokenEl('A', i, s)); });

  // panchina
  const bn = $('bench'); bn.innerHTML = '';
  if (!S.bench.length) bn.innerHTML = '<span class="none">Nessuno in panchina</span>';
  S.bench.forEach((id, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip' + (sel && sel.t === 'bench' && sel.i === i ? ' sel' : '');
    b.textContent = byId(id).name; b.title = 'Ruoli: ' + byId(id).roles.join(', ');
    wire(b, { t: 'bench', i });
    bn.append(b);
  });

  // suggerimento
  const h = $('hint');
  if (sel) { h.textContent = `Tocca un altro giocatore o un posto libero per scambiarlo con ${byId(get(sel)).name}. Tocca di nuovo per annullare.`; h.classList.add('on'); }
  else { h.textContent = 'Tocca un giocatore, poi un altro, per scambiarli (anche con la panchina). Il segno ! indica un giocatore fuori ruolo.'; h.classList.remove('on'); }

  // rosa
  const on = S.players.filter(p => p.on), tot = S.n * 2;
  $('count').textContent = `${on.length} convocati · servono ${tot}`;
  $('count').classList.toggle('low', on.length < tot);
  $('avail').innerHTML = ROLES.filter(r => need[r]).map(r => {
    const have = on.filter(p => p.roles.includes(r)).length, want = need[r] * 2;
    return `<span class="${have < want ? 'low' : ''}" title="${ROLE_NAME[r]}: ${have} disponibili, ${want} necessari">${r} ${have}/${want}</span>`;
  }).join('');

  const ul = $('list'); ul.innerHTML = '';
  if (!S.players.length) ul.innerHTML = '<li class="empty-list">Nessun giocatore. Scrivi il nome, scegli i ruoli e premi Aggiungi.</li>';
  S.players.forEach(p => {
    const li = document.createElement('li');
    if (!p.on) li.className = 'out';
    li.innerHTML = `<input type="checkbox" id="on-${p.id}" ${p.on ? 'checked' : ''} aria-label="Convocato"><div class="body"><label class="pname" for="on-${p.id}"></label><div class="roles"></div></div><button class="del" type="button" aria-label="Rimuovi">×</button>`;
    li.querySelector('.pname').textContent = p.name;
    li.querySelector('input').onchange = e => { p.on = e.target.checked; p.on ? addToBench(p.id) : removeFromTeams(p.id); save(); render(); };
    const rs = li.querySelector('.roles');
    ROLES.forEach(r => rs.append(roleChip(r, p.roles.includes(r), () => {
      if (p.roles.includes(r)) { if (p.roles.length > 1) p.roles = p.roles.filter(x => x !== r); }
      else p.roles = ROLES.filter(x => x === r || p.roles.includes(x));
      save(); render();
    })));
    li.querySelector('.del').onclick = () => { removeFromTeams(p.id); S.players = S.players.filter(x => x !== p); save(); render(); };
    ul.append(li);
  });

  $('genBtn').disabled = on.length === 0;
  $('genBtn').textContent = S.A.some(Boolean) ? 'Rigenera squadre' : 'Genera squadre';
  popKeys = new Set();
}

function roleChip(r, pressed, onclick) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'rchip'; b.dataset.r = r; b.textContent = r;
  b.title = ROLE_NAME[r]; b.setAttribute('aria-pressed', pressed);
  b.onclick = onclick;
  return b;
}
function renderNewRoles() {
  const box = $('newRoles'); box.innerHTML = '';
  ROLES.forEach(r => box.append(roleChip(r, newRoles.has(r), () => {
    if (newRoles.has(r)) { if (newRoles.size > 1) newRoles.delete(r); } else newRoles.add(r);
    renderNewRoles();
  })));
}
function removeFromTeams(id) {
  ['A', 'B'].forEach(t => S[t] = S[t].map(x => x === id ? null : x));
  S.bench = S.bench.filter(x => x !== id);
  sel = null;
}
function addToBench(id) { if (S.A.some(Boolean) || S.B.some(Boolean)) S.bench.push(id); }

$('addForm').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('nameIn').value.trim();
  if (!name) { $('nameIn').focus(); return; }
  const p = { id: uid(), name, roles: ROLES.filter(r => newRoles.has(r)), on: true };
  S.players.push(p); addToBench(p.id);
  $('nameIn').value = ''; $('nameIn').focus();
  save(); render();
});
$('genBtn').onclick = () => { generate(); render(); };

// copia formazioni per la chat
$('copyBtn').onclick = () => {
  const slots = layout();
  const line = t => slots.map((s, i) => S[t][i] ? `${byId(S[t][i]).name} (${s.r})` : null).filter(Boolean).join(', ') || '—';
  const txt = `⚽ Calcetto ${S.n} vs ${S.n} · modulo ${S.form}\n⚪ BIANCHI: ${line('A')}\n🔵 BLU: ${line('B')}` + (S.bench.length ? `\n🪑 Panchina: ${S.bench.map(id => byId(id).name).join(', ')}` : '');
  const done = () => toast('Formazioni copiate');
  try { navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt)); } catch (e) { fallbackCopy(txt); }
};
function fallbackCopy(txt) {
  const ta = document.createElement('textarea'); ta.value = txt; document.body.append(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove(); toast(ok ? 'Formazioni copiate' : 'Copia non riuscita: seleziona i nomi a mano');
}
let tt;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 1800); }

// strisce del prato
(function () {
  const g = $('stripes'); let h = '';
  for (let i = 0; i < 14; i++) h += `<rect x="0" y="${i * 7.5}" width="68" height="7.5" fill="${i % 2 ? 'var(--turf-2)' : 'var(--turf)'}"/>`;
  g.innerHTML = h;
})();

S = load();
if (!S) { S = seed(); resetTeams(); }
// chi aveva aperto la versione con i nomi di esempio riparte da rosa vuota
if (S.example) { S = seed(); resetTeams(); save(); }
renderNewRoles();
render();
</script>
</body>
</html>
